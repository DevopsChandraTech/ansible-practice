- name: installation of apps
  hosts: local
  connection: local
  become: true
  tasks:
  - name: app install
    ansible.builtin.package:
      name: "{{ item }}"
      state: latest
  - name: service start
    ansible.builtin.service:
      name: "{{ item }}"
      state: started
    loop:
    - nginx
    - mysql
    - zip
- name: functions or filters
  hosts: local
  connection: local
  vars:
    # string
    technologies: Linux,shell-script,ansible,aws
    # dict or map
    tags:
      Application: payment
      Environment: dev
    # lists
    list_tags:
      - key: Application
        value: payment
      - key: Environment
        value: dev
    name:
      - "Chandrasekhar k"
    email:
      - "CHANDU@GMAIL.com"
    ipaddress:
      - "19223342.168.2.3"

  tasks:
  # default filter without defining variable
  - name: default filters
    ansible.builtin.debug:
      msg: "{{ name | default('ramesh') }}"

  # strings into list    
  - name: convert string to list
    ansible.builtin.debug:
      msg: "{{ technologies | split(',') }}"
    
  # dictonaries into list
  - name: convert dict into list
    ansible.builtin.debug:
      msg: "{{ tags | dict2items }}"

  # list into dict
  - name: convert list into dict
    ansible.builtin.debug:
      msg: "{{ list_tags | items2dict }}"

  # read yaml file and take data into a variable
  - name: yaml file data take into a variable
    ansible.builtin.set_fact:
      student_json: "{{ lookup('file', 'code.yaml') | from_yaml }}"
  
  # convert yaml file into json
  - name: convert yaml into json
    ansible.builtin.debug:
      msg: "json: {{ student_json | to_json }}" 

  # copy yaml into json
  - name: copy yaml into json 
    ansible.builtin.copy:
      content: "{{ student_json | to_nice_json }}"
      dest: ./student.json  

  # convert lower cast into upppercase
  - name: lowercase into upppercase
    ansible.builtin.debug:
      msg: "{{ name | upper }}"

# convert uppercase into lowercase
  - name: upppercase into lowercase
    ansible.builtin.debug:
      msg: "{{ email | lower }}"

# check ipaddress format filter correct or not
  - name: check ipaddress format # (pip3.9 install netaddr)here we need to install python dependency for getting ip address  
    ansible.builtin.debug: # netaddr is the dependecy 
      msg: "{{ ipaddress | ansible.utils.ipaddr }}"




    
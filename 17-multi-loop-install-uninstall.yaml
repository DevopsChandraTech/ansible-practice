- name: multi loop install and uninstall
  hosts: local
  connection: local
  become: true
  tasks:
  - name: multi install apps
    ansible.builtin.package:
      name: {{ item.name }}
      state: {{ item.state }}
    loop: 
    - {name: "nginx", state: "latest"}
    - {name: "mysql", state: "latest"}
    - {name: "zip", state: "latest"}
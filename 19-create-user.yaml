- name: creating user
  hosts: local
  connection: local
  become: true
  tasks:
  - name: check user exist or not
    ansible.builtin.command: id roboshop
    register: user_output
    ignore_errors: true

  - name: user_output
    ansible.builtin.debug:
      msg: "{{ user_output }}"

  - name: creating user
    ansible.builtin.command: useradd roboshop
    when: user_output.rc != 0
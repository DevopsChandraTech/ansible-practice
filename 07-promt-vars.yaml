- name: promt variables
  hosts: local
  connection: local
  vars_promt:
  - name: username
    prompt: What is your username
    private: false

  - name: password
    promt: What is your password
    private: true # given true here its hided
  tasks:
  - name: giving through promt
    ansible.builtin.debug:
      msg: "the username is {{ username }} and password is {{ password }}"

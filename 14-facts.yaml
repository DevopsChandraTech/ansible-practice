- name: ansible_facts
  hosts: local
  connection: local
  become: true
  tasks:
  - name: install nginx when os is redhat
    ansible.builtin.dnf: # ansible package module
      name: nginx
      state: latest
      
  - name: start nginx service
    ansible.builtin.service:
      name: nginx
      state: started
    when: ansible_os_family == "RedHat" # use ansible while referring the facts

  - name: install nginx when os is debian
    ansible.builtin.apt: # ansible package module
      name: nginx
      state: latest
    when: ansible_os_family == "Debian" # use ansible while referring the facts

